<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Meta tags PWA -->
    <meta name="theme-color" content="#0f0f0f">
    <meta name="description" content="Ficha de RPG interativa completa - Crie e gerencie personagens, rolagens de dados, inventário e muito mais!">
    <meta name="keywords" content="RPG, ficha, personagem, dados, D&D, Tormenta, sistema, jogo, tabela, perícias">
    <meta name="author" content="RPG Console Pro">
    <meta name="robots" content="index, follow">
    
    <!-- PWA Capabilities -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RPG Console Pro">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="RPG Interactive Console Pro">
    <meta property="og:description" content="Ficha de RPG interativa completa para suas aventuras!">
    <meta property="og:image" content="icons/icon-512x512.png">
    <meta property="og:url" content="https://rpgconsole.example.com">
    <meta property="og:type" content="website">
    
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="RPG Interactive Console Pro">
    <meta name="twitter:description" content="Ficha de RPG interativa completa para suas aventuras!">
    <meta name="twitter:image" content="icons/icon-512x512.png">
    
    <!-- Manifest and Icons -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    
    <!-- Styles -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    
    <title>RPG Interactive Console Pro</title>
    
    <!-- PWA Registration -->
    <script>
        // Registrar Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(registration => {
                        console.log('✅ Service Worker registrado:', registration);
                        
                        // Verificar atualizações periodicamente
                        setInterval(() => {
                            registration.update();
                        }, 60 * 60 * 1000); // A cada hora
                    })
                    .catch(error => {
                        console.log('❌ Falha no registro do Service Worker:', error);
                    });
            });
        }
        
        // Detectar se está offline
        window.addEventListener('online', () => {
            showNotification('🌐 Conexão restaurada!', 'success');
        });
        
        window.addEventListener('offline', () => {
            showNotification('⚠️ Modo offline ativado', 'warning');
        });
    </script>
</head>
<body>
    <!-- Notificação System -->
    <div id="notification" class="notification">
        <span id="notification-text"></span>
        <button onclick="hideNotification()" class="notification-close">✕</button>
    </div>
    
    <!-- Splash Screen -->
    <div id="splash-overlay" class="splash-overlay">
        <div class="splash-screen">
            <div id="splash-left-text" class="splash-text">RPG</div>
            <div class="splash-subtext">SYSTEM LOAD...</div>
        </div>
        <div class="splash-screen">
            <div id="splash-right-text" class="splash-text">DATASCREEN</div>
            <div class="splash-subtext">PRO.EDITION BOOTING</div>
        </div>
    </div>
    
    <!-- Install Prompt -->
    <div id="install-prompt" class="install-prompt">
        <div class="install-content">
            <div class="install-icon">📱</div>
            <div class="install-text">
                <h3>Instalar RPG Console Pro</h3>
                <p>Use offline como um app nativo!</p>
            </div>
            <div class="install-buttons">
                <button class="install-btn secondary" onclick="hideInstallPrompt()">Depois</button>
                <button class="install-btn primary" onclick="installApp()">Instalar</button>
            </div>
        </div>
    </div>
    
    <!-- App Container -->
    <div class="app-container" id="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <button class="menu-toggle" id="menu-toggle" onclick="toggleMenu()">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="app-title">RPG CONSOLE PRO</div>
            </div>
            <div class="header-right">
                <div id="connection-status" class="connection-status online">
                    <i class="fas fa-wifi"></i>
                </div>
                <button class="header-btn" onclick="showSection('config')" title="Configurações">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </header>
        
        <!-- Main Content -->
        <main class="main-content">
            <!-- Left Screen -->
            <div class="screen display-screen" id="left-screen">
                <div class="screen-header">
                    <div id="screen-title" class="screen-title">SISTEMA // STATUS</div>
                    <div class="screen-actions">
                        <button class="action-btn small" onclick="toggleFullscreen()" title="Tela Cheia">
                            <i class="fas fa-expand"></i>
                        </button>
                    </div>
                </div>
                <div class="content-area" id="main-content">
                    <!-- Content will be loaded here by JavaScript -->
                </div>
                <div id="save-msg" class="save-indicator">
                    <i class="fas fa-check-circle"></i> DADOS SALVOS!
                </div>
            </div>
            
            <!-- Right Screen -->
            <div class="screen menu-screen" id="right-screen">
                <!-- Mode Toggle -->
                <div class="mode-toggle">
                    <span>EXIBIR</span>
                    <label class="switch">
                        <input type="checkbox" id="mode-switch" onchange="toggleMode()">
                        <span class="slider"></span>
                    </label>
                    <span>EDITAR</span>
                </div>
                
                <!-- Status Bar -->
                <div class="status-bar" id="status-bar-container">
                    <!-- Status will be loaded here -->
                </div>
                
                <!-- Navigation -->
                <nav class="nav-grid" id="nav-grid">
                    <!-- Navigation buttons will be loaded here -->
                </nav>
                
                <!-- Footer -->
                <div class="menu-footer">
                    <div class="version">v3.0.0 PWA</div>
                    <div class="storage-info" id="storage-info">
                        <i class="fas fa-database"></i>
                        <span id="storage-used">0%</span>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- Mobile Navigation Overlay -->
        <div id="mobile-nav" class="mobile-nav-overlay">
            <div class="mobile-nav-content">
                <div class="mobile-nav-header">
                    <h3>Navegação</h3>
                    <button class="close-nav" onclick="toggleMenu()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="mobile-nav-buttons">
                    <!-- Mobile navigation will be loaded here -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- Audio Elements -->
    <audio id="diceSound" preload="auto">
        <source src="sounds/dice-roll.mp3" type="audio/mpeg">
        Seu navegador não suporta áudio.
    </audio>
    <audio id="clickSound" preload="auto">
        <source src="sounds/click.mp3" type="audio/mpeg">
        Seu navegador não suporta áudio.
    </audio>
    
    <!-- JavaScript Files -->
    <script src="app.js"></script>
    
    <!-- PWA Installation Handler -->
    <script>
        let deferredPrompt;
        
        // Evento para capturar o prompt de instalação
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            
            // Mostrar prompt após 15 segundos
            setTimeout(() => {
                if (deferredPrompt && !isAppInstalled()) {
                    showInstallPrompt();
                }
            }, 15000);
        });
        
        // Verificar se o app já está instalado
        function isAppInstalled() {
            return window.matchMedia('(display-mode: standalone)').matches ||
                   window.navigator.standalone ||
                   document.referrer.includes('android-app://');
        }
        
        // Mostrar prompt de instalação
        function showInstallPrompt() {
            const prompt = document.getElementById('install-prompt');
            prompt.style.display = 'flex';
            setTimeout(() => {
                prompt.classList.add('show');
            }, 10);
        }
        
        // Esconder prompt de instalação
        function hideInstallPrompt() {
            const prompt = document.getElementById('install-prompt');
            prompt.classList.remove('show');
            setTimeout(() => {
                prompt.style.display = 'none';
            }, 300);
        }
        
        // Instalar app
        function installApp() {
            if (!deferredPrompt) return;
            
            deferredPrompt.prompt();
            
            deferredPrompt.userChoice.then((choiceResult) => {
                if (choiceResult.outcome === 'accepted') {
                    showNotification('📱 App instalado com sucesso!', 'success');
                }
                deferredPrompt = null;
                hideInstallPrompt();
            });
        }
        
        // Sistema de notificações
        function showNotification(message, type = 'info') {
            const notification = document.getElementById('notification');
            const text = document.getElementById('notification-text');
            
            notification.className = `notification ${type}`;
            text.textContent = message;
            notification.style.display = 'flex';
            
            setTimeout(() => {
                notification.classList.add('show');
            }, 10);
            
            // Auto-esconder após 3 segundos
            setTimeout(() => {
                hideNotification();
            }, 3000);
        }
        
        function hideNotification() {
            const notification = document.getElementById('notification');
            notification.classList.remove('show');
            setTimeout(() => {
                notification.style.display = 'none';
            }, 300);
        }
        
        // Tela cheia
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    showNotification('Não foi possível entrar em tela cheia', 'error');
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
        
        // Toggle menu mobile
        function toggleMenu() {
            const mobileNav = document.getElementById('mobile-nav');
            mobileNav.classList.toggle('show');
        }
        
        // Atualizar status da conexão
        function updateConnectionStatus() {
            const status = document.getElementById('connection-status');
            if (navigator.onLine) {
                status.className = 'connection-status online';
                status.innerHTML = '<i class="fas fa-wifi"></i>';
            } else {
                status.className = 'connection-status offline';
                status.innerHTML = '<i class="fas fa-wifi-slash"></i>';
            }
        }
        
        // Atualizar uso de armazenamento
        function updateStorageInfo() {
            if ('storage' in navigator && 'estimate' in navigator.storage) {
                navigator.storage.estimate().then(estimate => {
                    const used = estimate.usage;
                    const total = estimate.quota;
                    const percent = total ? Math.round((used / total) * 100) : 0;
                    
                    document.getElementById('storage-used').textContent = `${percent}%`;
                });
            }
        }
        
        // Inicializar
        window.addEventListener('load', () => {
            updateConnectionStatus();
            updateStorageInfo();
            
            // Atualizar a cada 30 segundos
            setInterval(updateStorageInfo, 30000);
        });
        
        // Suporte a teclas de atalho
        document.addEventListener('keydown', (e) => {
            // Ctrl+S para salvar
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                save();
                showNotification('💾 Dados salvos com sucesso!', 'success');
            }
            
            // Escape para sair do modo tela cheia
            if (e.key === 'Escape' && document.fullscreenElement) {
                document.exitFullscreen();
            }
            
            // Números para navegação rápida (1-8)
            if (e.key >= '1' && e.key <= '8' && !e.ctrlKey && !e.altKey) {
                const sections = ['status', 'inventory', 'skills', 'proficiencies', 'lore', 'dice', 'journal', 'config'];
                const index = parseInt(e.key) - 1;
                if (sections[index]) {
                    showSection(sections[index]);
                    playSound('click');
                }
            }
        });
        
        // Tocar sons
        function playSound(soundId) {
            const sound = document.getElementById(soundId);
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(e => console.log('Não foi possível tocar som:', e));
            }
        }
    </script>
</body>
</html>
